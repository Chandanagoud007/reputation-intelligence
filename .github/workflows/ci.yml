on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: repuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: reputation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongo:
        image: mongo:7-jammy
        env:
          MONGO_INITDB_ROOT_USERNAME: repuser
          MONGO_INITDB_ROOT_PASSWORD: testpassword
        ports:
          - 27017:27017

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt --prefer-binary

      - name: Create test .env
        working-directory: backend
        run: |
          cat > .env << EOF
          APP_ENV=development
          DEBUG=true
          SECRET_KEY=testsecretkey32byteslong12345678
          JWT_SECRET_KEY=testjwtsecretkey32byteslong12345
          DATABASE_URL=postgresql+asyncpg://repuser:testpassword@localhost:5432/reputation_test
          POSTGRES_USER=repuser
          POSTGRES_PASSWORD=testpassword
          POSTGRES_DB=reputation_test
          POSTGRES_HOST=localhost
          MONGO_URI=mongodb://repuser:testpassword@localhost:27017/reputation_test?authSource=admin
          MONGO_DB=reputation_test
          REDIS_URL=redis://localhost:6379/0
          RABBITMQ_URL=amqp://guest:guest@localhost:5672/
          AWS_REGION=us-east-1
          AWS_ACCESS_KEY_ID=test
          AWS_SECRET_ACCESS_KEY=test
          AWS_S3_BUCKET=test-bucket
          AWS_SES_SENDER_EMAIL=test@test.com
          ALLOWED_HOSTS=localhost,127.0.0.1
          EOF

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: |
          PYTHONPATH=. pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          fail_ci_if_error: false

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run linter
        working-directory: frontend
        run: npm run lint || true

      - name: Run tests
        working-directory: frontend
        run: npm run test -- --run || true

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000/api/v1

# NOTE: AWS ECS deploy disabled - running locally via Docker Compose
# Re-enable docker-build and deploy-staging when ready for cloud
