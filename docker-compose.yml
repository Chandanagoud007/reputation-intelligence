version: "3.9"

networks:
  rep_intel_net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data:

services:
  # ─── Databases ───────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: rep_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reppassword}
      POSTGRES_DB: ${POSTGRES_DB:-reputation_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rep_intel_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repuser}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7-jammy
    container_name: rep_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-repuser}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-reppassword}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-reputation_reviews}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./infrastructure/docker/mongo/init.js:/docker-entrypoint-initdb.d/init.js
    networks:
      - rep_intel_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rep_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rep_intel_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Message Queue ────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rep_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-repuser}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-reppassword}
      RABBITMQ_DEFAULT_VHOST: reputation
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI
    networks:
      - rep_intel_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: rep_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - rep_intel_net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─── ML / NLP Worker ─────────────────────────────────────────
  ml_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: rep_ml_worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rep_intel_net
    command: python -m app.services.nlp.worker

  # ─── Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: rep_frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - rep_intel_net

  # ─── Monitoring ───────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: rep_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - rep_intel_net

  grafana:
    image: grafana/grafana:latest
    container_name: rep_grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    networks:
      - rep_intel_net
